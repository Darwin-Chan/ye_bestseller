<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>1688 畅销品监控 · 库存数据交换</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--line:#e5e9f0;--txt:#1f2937;--mut:#6b7280;--pri:#2563eb;--red:#dc2626;--grn:#16a34a;--amb:#d97706}
  *{box-sizing:border-box;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  body{margin:0;background:var(--bg);color:var(--txt)}
  .wrap{max-width:760px;margin:0 auto;padding:18px}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  header h1{font-size:19px;margin:0}
  .muted{color:var(--mut);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{background:var(--pri);color:#fff;border:0;padding:9px 20px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line);font-weight:500}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
  #note{color:var(--amb);font-size:13px}
  #log{margin:0;white-space:pre-wrap;word-break:break-all;font:12.5px/1.6 Consolas,Menlo,monospace;min-height:220px;max-height:52vh;overflow:auto}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px}
  .pill.g{background:#dcfce7;color:var(--grn)}
  .pill.r{background:#fee2e2;color:var(--red)}
  .pill.a{background:#fef3c7;color:var(--amb)}
  .pill.n{background:#eef2f7;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>1688 畅销品监控 · 库存数据交换</h1>
    <span class="muted" id="who"></span>
  </header>

  <div class="card">
    <div class="row">
      <button class="btn" id="runBtn">导出&amp;汇总</button>
      <button class="btn ghost" id="exportBtn">仅导出</button>
      <button class="btn ghost" id="mergeBtn">仅汇总</button>
      <span id="note"></span>
    </div>
    <div class="row" style="margin-top:10px">
      <span class="muted">报告目录：</span><span class="muted" id="reportDir"></span>
    </div>
  </div>

  <div class="card"><pre id="log">（还没跑过。点「导出&amp;汇总」：检查 → 导出 → 拉取 → 汇总 → 报告。）</pre></div>

  <div class="row"><span id="status" class="pill n">待命</span></div>
</div>

<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const noteEl = document.getElementById('note');
const exportBtn = document.getElementById('exportBtn');
const buttons = ['runBtn', 'exportBtn', 'mergeBtn'].map(id => document.getElementById(id));
let mergeOnly = false;

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'pill ' + cls;
}

function applyBusy(running) {
  buttons.forEach(b => b.disabled = running);
  // 纯汇总机上「仅导出」没有可做的事：入口保留着（不藏），按钮置灰
  exportBtn.disabled = running || mergeOnly;
}

async function refresh() {
  const s = await window.pywebview.api.state();
  document.getElementById('who').textContent = `本机 ${s.machine_id}（${s.role_gloss}）`;
  document.getElementById('reportDir').textContent = s.report_dir;
  noteEl.textContent = s.export_note || '';
  mergeOnly = !!s.merge_only;
  applyBusy(s.running);
  if (!s.running && s.exit_code !== null && s.exit_code !== undefined) {
    setStatus(`上次运行结束：退出码 ${s.exit_code}`, s.exit_code === 0 ? 'g' : (s.exit_code === 1 ? 'a' : 'r'));
  }
}

async function poll() {
  const p = await window.pywebview.api.poll();
  logEl.textContent = p.lines.length ? p.lines.join('\n') : logEl.textContent;
  logEl.scrollTop = logEl.scrollHeight;
  if (p.running) { setStatus('运行中…', 'a'); }
  applyBusy(p.running);
  if (!p.running && p.exit_code !== null && p.exit_code !== undefined) {
    setStatus(`结束：退出码 ${p.exit_code}`, p.exit_code === 0 ? 'g' : (p.exit_code === 1 ? 'a' : 'r'));
  }
}

async function start(only) {
  logEl.textContent = '';
  const r = await window.pywebview.api.start(only);
  if (!r.ok) { setStatus(r.reason, 'a'); return; }
  setStatus('运行中…', 'a');
  applyBusy(true);
}

document.getElementById('runBtn').onclick = () => start(null);
document.getElementById('exportBtn').onclick = () => start('export');
document.getElementById('mergeBtn').onclick = () => start('merge');

window.addEventListener('pywebviewready', () => {
  refresh();
  setInterval(poll, 700);
});
</script>
</body>
</html>
