# 分析配置（示例）。仓库只追踪这一份示例；真配置 config/analysis.toml 每台机器自建、
# 已在 .gitignore 里，不进代码仓（与 shops.example.csv 同款做法）。
#
# 用法：复制本文件为 config/analysis.toml，把 database / cache 改成本机的路径。
# 相对路径以本配置所在目录（config/）为基准。

[analysis]
# 现有库存数据库；「按机器改」（采集机上是本机采集库，再按需换数据源）。
database = "../data/bestseller.db"
# 分析草稿库：暂存与「继续上次分析」的独立文件；缺省 analysis-drafts.sqlite（配置目录下）。
# store = "../data/analysis-drafts.sqlite"
# 离线报告（导出 HTML）的落盘目录；缺省 ../output（项目的 output 文件夹）。
# output = "../output"
# ISO 星期：1=周一，7=周日。只是提醒，不调度采集。
full_capture_weekday = 1

[matching]
# disabled：不调用模型；direct：主模型接收图片；caption：独立视觉模型先提取证据。
mode = "disabled"
cache = "../data/matching.sqlite"
concurrency = 2
candidates = 6
# 判断预算下限：召回分（名称双字片段与图片感知特征的共享 token 数）低于它的商品对不交模型
# 判断。这是预算规则不是判定——被挡下的对保持「没判过」（未知，不是判否），不产生任何边；
# 0 = 不设限（等价于下限生效前的现状）。跨机「分组对一眼一致」要求各机同值，与 candidates
# 同规；换召回特征规则时要重新标定（ADR-0040）。缺省 4 的依据：实测 ≤3 分的对占判断预算
# 42.8%、产 0 条正边。
min_score = 4

[matching.model]
endpoint = "https://api.deepseek.com/v1/chat/completions"
model = "deepseek-chat"
key_env = "DEEPSEEK_API_KEY"
timeout = 30

# caption 模式必须另配支持 image_url 输入的真实视觉服务。
# [matching.vision]
# endpoint = "https://your-vision-service/v1/chat/completions"
# model = "your-vision-model"
# key_env = "VISION_API_KEY"
# timeout = 30
