[run]
# 每个店铺最多翻几页商品列表
max_pages_per_shop = 10
# 单轮详情页总数上限（跨店重复采集也计入）
max_detail_pages_per_round = 3000
# 单个商品详情最多尝试次数
max_attempts_per_page = 2
# 失败率超过该比例时整轮暂停等人工决策
fail_rate_limit = 0.10
# 触发滑块/登录墙后等待人工处理的最长分钟数
human_pause_minutes = 10
# 判定“需要人工介入”前的确认窗口（秒）：瞬时报错信号在此窗口内自行消失则视为误报
intervention_confirmation_sec = 2.0
# 命中淘宝 deny/验证拦截页（反爬限流）时的退避时长（秒）：自动放慢，降低再次触发限流概率
deny_backoff_sec = 30.0         # 商品第 1 次 deny 的退避
deny_retry2_backoff_sec = 60.0  # 商品第 2 次 deny 的退避
deny_scan_wait_sec = 30.0       # 扫码解除后重新抓取的成功判定超时（秒），超时视为该商品失败
deny_window_minutes = 10        # deny 计数滚动窗口（分钟）
deny_shop_limit = 7             # 窗口内该店 deny≥N -> 跳过该店
deny_round_limit = 10           # 窗口内整轮 deny≥N -> 中止本轮
# 是否打乱店铺内商品访问顺序（拟人化）
shuffle_within_shop = true
# 出现滑块/登录墙等需要人工干预时是否播放警报音
alarm_on_intervention = true

[human]
# 详情页之间基础延迟（秒，随机取区间内值）
detail_delay_sec = [0.8, 2]
# 每 N 个详情页后插入一次较长的停顿（N 在该区间随机）
long_pause_interval = [12, 20]
long_pause_sec = [10, 20]
# 每完成一批商品后休息
batch_size = 300
batch_rest_sec = [20, 40]
# 列表页之间延迟
list_delay_sec = [1.5, 3]
# 点击/操作前等待
action_delay_sec = [0.6, 1.5]
# 页面加载完成后、读取数据前的等待
read_delay_sec = [0.8, 1.5]
# 失败重试：指数退避基础秒数 + 随机抖动秒数
retry_base_sec = 5.0
retry_jitter_sec = 2.0

[browser]
# MVP 必须使用有头浏览器以便人工处理滑块/扫码
headless = false
# 驱动方式：drission（推荐，可过 1688 登录）/ playwright
driver = "pw_cdp"
# 使用本机已装浏览器：msedge / chrome / chromium（chromium 需 playwright install chromium）
channel = "msedge"
# 统一使用实际登录过的用户数据目录（Readme/PRD 均以 Edge 为例）
profile_dir = "profiles/account1_edge"
# Playwright / DrissionPage 使用同一套用户数据目录与浏览器路径
user_data_path = "profiles/account1_edge"
chrome_path = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
# 是否复用系统默认浏览器用户配置；现为 false，使用上方独立配置目录。
use_system_profile = false
start_browser = true
attach_port = 9222
slow_mo_ms = 100
timeout_ms = 45000
base_url = "https://www.1688.com/"

[paths]
shop_csv = "config/shops.csv"
db_file = "data/bestseller.db"
data_dir = "data"
output_dir = "output"
logs_dir = "logs"
screenshot_dir = "data/screenshots"
raw_page_dir = "data/raw_pages"

# =====================================================================
# [builtin_waits] 内置固定等待（仅作文档记录，暂未被代码读取）
# ---------------------------------------------------------------------
# 说明：以下等待目前仍写死在驱动代码里（browser_pw/browser_dp 等），
# 尚未接入配置读取——改动本区块不会生效。这里仅为"当前实际值"留档，
# 便于和上方 [human]（拟人化随机延迟）及 [run]（退避/超时）区分。
# 目标：后续逐步把这些固定等待迁移到配置驱动。
# =====================================================================
[builtin_waits]
# 用普通进程启动浏览器后，等待启动完成 + 远程调试端口可连接
browser_launch_sec = 8.0
# 进入店铺/商品列表页（page.goto）后，等页面渲染出商品卡片
page_settle_after_goto_sec = 4.0
# 点击「销量」排序后，等列表按销量重新返回
sort_click_settle_sec = 3.0
# 列表页无验证拦截时，额外等商品从懒加载出现
listing_load_extra_sec = 5.0
# 向下滚动一屏触发懒加载后，等新一批卡片加载
scroll_step_sec = 1.2
# 点击「下一页 / 加载更多」后，等列表刷新
next_page_settle_sec = 2.0
# 从详情返回上一页（go_back）后，等页面稳定
back_page_settle_sec = 1.0
# 人工介入确认窗口内，轮询"瞬时信号是否已自行消失"的间隔
confirm_poll_sec = 0.3
# 判定需人工介入后、先刷新一次，刷新后等页面恢复的等待
reload_recover_sec = 1.5
# 人工介入解决前（以及 deny 响铃扫码时），每次响铃的间隔
alarm_interval_sec = 3.0
# deny 解除后限时重抓（deny_scan_wait_sec 内）的每次重试间隔
deny_retry_poll_sec = 1.0
# 详情弹窗等待的是 domcontentloaded（非固定秒数，上限用 [browser].timeout_ms）
popup_wait_for = "domcontentloaded"
