[run]
# 每个店铺最多翻几页商品列表
max_pages_per_shop = 30
# 单轮详情预算（允许进入详情的商品机会数，跨店累计；同一商品重试只算一次）
max_detail_opportunities_per_round = 1000
# 单个商品详情最多尝试次数
max_attempts_per_page = 2
# 失败率超过该比例时整轮暂停等人工决策
fail_rate_limit = 0.10
# 触发滑块/登录墙后等待人工处理的最长分钟数
human_pause_minutes = 10
# 判定“需要人工介入”前的确认窗口（秒）：瞬时报错信号在此窗口内自行消失则视为误报
intervention_confirmation_sec = 2.0
# 命中淘宝 deny/验证拦截页（反爬限流）时的退避时长（秒）：自动放慢，降低再次触发限流概率
deny_backoff_sec = 30.0         # 商品第 1 次 deny 的退避
deny_retry2_backoff_sec = 60.0  # 商品第 2 次 deny 的退避
deny_window_minutes = 10        # deny 计数滚动窗口（分钟）
deny_shop_limit = 7             # 窗口内该店 deny≥N -> 跳过该店
deny_round_limit = 10           # 窗口内整轮 deny≥N -> 中止本轮
# 是否打乱店铺内商品访问顺序（拟人化）
shuffle_within_shop = true
# 出现滑块/登录墙等需要人工干预时是否播放警报音
alarm_on_intervention = true

[human]
# 详情页之间基础延迟（秒，随机取区间内值）
detail_delay_sec = [0.8, 2]
# 每 N 个详情页后插入一次较长的停顿（N 在该区间随机）
long_pause_interval = [12, 20]
long_pause_sec = [10, 20]
# 每完成一批商品后休息
batch_size = 300
batch_rest_sec = [20, 40]
# 列表页之间延迟
list_delay_sec = [1.5, 3]
# 点击/操作前等待
action_delay_sec = [0.6, 1.5]
# 页面加载完成后、读取数据前的等待
read_delay_sec = [0.8, 1.5]
# 失败重试：指数退避基础秒数 + 随机抖动秒数
retry_base_sec = 5.0
retry_jitter_sec = 2.0

[browser]
# MVP 必须使用有头浏览器以便人工处理滑块/扫码
headless = false
# 驱动方式：drission（推荐，可过 1688 登录）/ playwright
driver = "pw_cdp"
# 使用本机已装浏览器：msedge / chrome / chromium（chromium 需 playwright install chromium）
channel = "msedge"
# 统一使用实际登录过的用户数据目录（Readme/PRD 均以 Edge 为例）
profile_dir = "F:/AI/bestseller_runtime/profiles/account1_edge"
# Playwright / DrissionPage 使用同一套用户数据目录与浏览器路径
user_data_path = "F:/AI/bestseller_runtime/profiles/account1_edge"
chrome_path = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
# 是否复用系统默认浏览器用户配置；现为 false，使用上方独立配置目录。
use_system_profile = false
start_browser = true
attach_port = 9222
slow_mo_ms = 100
timeout_ms = 45000
base_url = "https://www.1688.com/"

[paths]
shop_csv = "config/shops.csv"
db_file = "F:/AI/bestseller_runtime/data/bestseller.db"
data_dir = "F:/AI/bestseller_runtime/data"
output_dir = "F:/AI/bestseller_runtime/output"
logs_dir = "F:/AI/bestseller_runtime/logs"
screenshot_dir = "F:/AI/bestseller_runtime/data/screenshots"
raw_page_dir = "F:/AI/bestseller_runtime/data/raw_pages"

# =====================================================================
# [builtin_waits] 仍为代码常量的人工介入节拍（仅作文档记录，暂未被配置读取）
# ---------------------------------------------------------------------
# 说明：
#  - 页面/商品“就绪”相关的等待，已改为「条件等待为主 + 上限兜底」：
#    driver 层等「商品卡片出现 / 新卡片加载 / 调试端口可连接」，超时才按
#    browser_pw 里的 _WAIT_* 常量继续，不再固定 sleep；也不再作为配置项开放。
#  - 仍写死在代码里、随窗口/流程节拍走的是下面这 4 项“人工介入”节奏，
#    改动本区块不会生效，仅留档当前值。
# =====================================================================
[builtin_waits]
# 人工介入确认窗口内，轮询"瞬时信号是否已自行消失"的间隔
confirm_poll_sec = 0.3
# 判定需人工介入后、先刷新一次，刷新后等页面恢复的等待
reload_recover_sec = 1.5
# 人工介入解决前，每次响铃的间隔
alarm_interval_sec = 3.0
