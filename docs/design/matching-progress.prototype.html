<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>匹配进度遮罩 · 交互原型</title>
<style>
/* 配色与「库存数据抓取」「库存数据交换」「销量分析」共用同一套变量：改这里时四处一起改。 */
:root{--bg:#f5f7fa;--card:#fff;--line:#e5e9f0;--txt:#1f2937;--mut:#6b7280;--pri:#2563eb;--red:#dc2626;--grn:#16a34a;--amb:#d97706}
*{box-sizing:border-box}
body{margin:0;padding-bottom:96px;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.7;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:22px max(24px,calc((100vw - 1120px)/2))}
header h1{margin:0;font-size:20px}header span{color:var(--mut);font-size:13px}
main{max-width:1168px;margin:26px auto;padding:0 24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 24px;margin:16px 0}
button{font:inherit;border:1px solid var(--line);border-radius:5px;padding:8px 12px;background:white;color:var(--txt);cursor:pointer}
button.primary{background:var(--pri);color:white}button:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--mut)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.match-bar{justify-content:flex-start;margin:12px 0}#matchingStatus{color:var(--mut)}
/* 阶段图例：与「库存数据抓取」页同一组件（ui_live.html 的 .tabs/.step），改这里时两页一起改。 */
.tabs{display:flex;align-items:stretch;margin-bottom:14px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.step .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:#fff;border:2px solid var(--line);color:var(--mut);z-index:1}
.step .lbl{font-size:14px;font-weight:600;color:var(--mut)}
.step::after{content:"";position:absolute;top:17px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:last-child::after{display:none}
.step.active .dot{background:var(--pri);border-color:var(--pri);color:#fff}
.step.active .lbl{color:var(--pri)}
.step.done .dot{background:var(--grn);border-color:var(--grn);color:#fff}
.step.done .lbl{color:var(--grn)}
.step.done::after{background:var(--grn)}
/* 确认同款页骨架（缩略版，只为给遮罩提供真实上下文） */
.review-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;margin-top:16px}
#products{display:flex;flex-direction:column;gap:8px}
.group-choice{display:block;width:100%;text-align:left;padding:12px}
.group-choice[aria-pressed=true]{border:2px solid var(--pri);background:#eef2f7}
.group-choice small{display:block;color:var(--mut)}
#groupDetail{border:1px solid var(--line);border-radius:8px;padding:16px;min-height:220px;background:#fff}
.skeleton{height:38px;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f6f8fb,#eef2f7);margin:8px 0}
/* 遮罩本体 */
#mask{border:0;border-radius:12px;width:min(680px,92vw);max-width:680px;max-height:92vh;overflow:auto;padding:26px 28px}
#mask::backdrop{background:rgba(15,23,42,.45)}
#mask h2{margin:0 0 2px;font-size:20px}
.phase{font-size:13px;color:var(--mut);margin:0 0 14px}.phase b{color:var(--pri)}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 18px;padding:0;list-style:none}
.steps li{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#f8fafc}
.steps li.ok{border-color:var(--grn);color:var(--grn)}
.steps li.cur{border-color:var(--pri);color:var(--pri);font-weight:600;background:#eff6ff}
.pbar{height:10px;border-radius:999px;background:#eef2f7;overflow:hidden;margin:0 0 8px}
.pfill{height:100%;background:var(--pri);width:38%}
.big{font-size:16px;font-weight:650;margin:0 0 4px}
.sub{font-size:13px;color:var(--mut);margin:0}
.warn{margin:18px 0 0;padding:12px 14px;border:1px solid #fde68a;background:#fffbeb;border-radius:8px;font-size:13px}
.acts{display:flex;align-items:center;gap:12px;margin-top:18px}.acts .spacer{flex:1}
.errbox{color:var(--red);background:#fee2e2;padding:14px;border-radius:6px;font-size:13px;margin:6px 0 0}
/* 原生确认框的形态示意（内嵌在遮罩里展示，真机是 pywebview 关窗时弹的 Win32 框） */
.native{background:#f0f0f0;border:1px solid #9ca3af;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.35);margin-top:16px}
.native .title{background:#e5e7eb;color:#111827;padding:7px 12px;font-size:13px;font-weight:600;border-bottom:1px solid #d1d5db}
.native .body{background:#fff;padding:18px 20px;font-size:13px;line-height:1.75;white-space:pre-line}
.native .buttons{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px}
/* 原型浮条：不属于方案本身，只是为了能把各状态翻一遍（放在遮罩内，showModal 才点得动） */
.proto{margin-top:20px;padding-top:14px;border-top:1px dashed #cbd5e1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.proto b{color:var(--amb);font-weight:600}
.proto button{padding:5px 10px;font-size:12px}
.proto button[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
</style>
<header><h1>1688 畅销品监控 · 销量分析</h1><span>选择日期 · 固定库存 · 核对商品</span></header>
<main><div class="tabs">
<div class="step done" data-tab="dates"><span class="dot">1</span><span class="lbl">选择区间</span></div>
<div class="step active" data-tab="review"><span class="dot">2</span><span class="lbl">确认同款</span></div>
<div class="step" data-tab="result"><span class="dot">3</span><span class="lbl">分析结果</span></div>
</div>

<section class="panel"><div class="bar"><h2 style="margin:0">确认同款</h2><button>重新选择日期</button></div>
<div id="snapshotInfo"></div>
<p class="muted">建议分组均待人工确认；低把握判断保留缓存，需人工核对。</p>
<div class="bar match-bar"><button id="runMatching">模型匹配同款</button><span id="matchingStatus" role="status"></span></div>
<div class="review-layout"><nav id="products" aria-label="同款分组列表"></nav><article id="groupDetail"></article></div>
<div class="bar" style="margin-top:16px"><span class="muted" id="saveStatus"></span><span><button>暂时保存</button> <button class="primary" disabled>保存分组并查看畅销品</button></span></div>
</section></main>

<dialog id="mask" aria-label="匹配进度"><div id="maskBody"></div>
<div class="proto"><b>原型浮条（不属于方案）</b>
<button data-state="fresh" aria-pressed="true">首次分析 · 判断中</button>
<button data-state="late">判断中 · 近尾声</button>
<button data-state="stopping">正在停止</button>
<button data-state="failed">匹配没能完成</button>
<button data-state="retry">重试 · 少量对</button>
<button data-state="closing">关窗确认</button>
</div></dialog>

<script>
const GROUPS=[["G1 · 4 个商品","三层置物架 · 销量 182"],["G2 · 2 个商品","折叠收纳箱 · 销量 96"],["G3 · 1 个商品","棉麻抱枕套 · 销量 41"]];
const $=id=>document.getElementById(id);
const REVIEW_INFO=`<p class="muted" style="margin:6px 0 0"><b>日期区间</b>：2026-09-12 — 2026-09-22　<b>数据固定于</b>：2026-09-23 17:52:38</p><p class="muted" style="margin:2px 0 0">878 个商品 · 591 组同款（其中 372 组待确认）</p>`;
const PREPARING_INFO=`<p class="muted" style="margin:6px 0 0">正在冻结库存数据…（这一步通常几十秒，完成后开始逐对判断同款）</p>`;

function steps(current){
  const names=["冻结库存数据","召回候选同款","检查模型可用性","逐对判断同款","装配同款组"];
  return `<ul class="steps">${names.map((n,i)=>`<li class="${i<current?"ok":i===current?"cur":""}">${i<current?"✓ ":""}${n}</li>`).join("")}</ul>`;
}
const STATES={
  fresh:{empty:true,html:`
    <h2>正在匹配同款</h2>
    <p class="phase">第 4 步 / 共 5 步：<b>逐对判断同款</b>（这一步要调用大模型，最耗时）</p>
    ${steps(3)}
    <div class="pbar"><div class="pfill" style="width:38%"></div></div>
    <p class="big">已完成 120 / 317 对</p>
    <p class="sub">可判 878 个商品 · 3636 对命中缓存不花钱 · 208 对低于判断下限不送模型</p>
    <p class="sub">已用 3 分 20 秒 · 预计还需约 8 分钟</p>
    <p class="warn">匹配期间程序只做这一件事，完成后自动回到本页。<br>
    <b>请勿关闭窗口。</b>已判断的会保存，重新开始会接着算，不会重复花钱；但这一趟的分析结果会没。</p>
    <div class="acts"><button>停止匹配</button><span class="spacer"></span><span class="muted">停下后已判断的会留下，稍后可从本页继续</span></div>`},
  late:{html:`
    <h2>正在匹配同款</h2>
    <p class="phase">第 4 步 / 共 5 步：<b>逐对判断同款</b>（这一步要调用大模型，最耗时）</p>
    ${steps(3)}
    <div class="pbar"><div class="pfill" style="width:94%"></div></div>
    <p class="big">已完成 300 / 317 对</p>
    <p class="sub">可判 878 个商品 · 3636 对命中缓存不花钱 · 208 对低于判断下限不送模型</p>
    <p class="sub">已用 12 分 20 秒 · 预计还需约 1 分钟</p>
    <p class="warn">匹配期间程序只做这一件事，完成后自动回到本页。<br>
    <b>请勿关闭窗口。</b>已判断的会保存，重新开始会接着算，不会重复花钱；但这一趟的分析结果会没。</p>
    <div class="acts"><button>停止匹配</button><span class="spacer"></span><span class="muted">停下后已判断的会留下，稍后可从本页继续</span></div>`},
  stopping:{html:`
    <h2>正在停止匹配…</h2>
    <p class="phase">等一个在途判断结束（最多 30 秒）；<b>已判的会留下</b></p>
    ${steps(3)}
    <div class="pbar"><div class="pfill" style="width:38%"></div></div>
    <p class="big">已完成 120 / 317 对</p>
    <p class="sub">停下后自动进入本页；没判断的对记为「失败」，点「模型匹配同款」可以接着判</p>
    <p class="sub">点「停止匹配」与点关窗确认里的「关闭并停止」进的都是这一态；收尾完成前窗口不消失</p>
    <div class="acts"><button disabled>停止匹配</button></div>`},
  failed:{html:`
    <h2>匹配没能完成</h2>
    <p class="phase">日期区间 2026-09-12 — 2026-09-22 · 已用 1 分 02 秒</p>
    <p class="errbox">读取库存数据失败，请检查分析配置和数据库后重试</p>
    <p class="warn">已判断的会保存，重试会接着算，不会重复花钱。</p>
    <div class="acts"><button class="primary">重试</button><button>返回重选日期</button></div>`},
  retry:{html:`
    <h2>正在匹配同款（重试）</h2>
    <p class="phase">第 4 步 / 共 5 步：<b>逐对判断同款</b></p>
    ${steps(3)}
    <div class="pbar"><div class="pfill" style="width:38%"></div></div>
    <p class="big">已完成 3 / 8 对</p>
    <p class="sub">本次只有 8 对要判断，其余 3953 对命中缓存（不花钱）</p>
    <p class="sub">已用 12 秒 · 预计还需约 20 秒</p>
    <p class="warn">匹配期间程序只做这一件事，完成后自动回到本页。<br>
    <b>请勿关闭窗口。</b>已判断的会保存，重新开始会接着算，不会重复花钱；但这一趟的分析结果会没。</p>
    <div class="acts"><button>停止匹配</button><span class="spacer"></span><span class="muted">停下后已判断的会留下，稍后可从本页继续</span></div>`},
  closing:{html:`
    <h2>匹配仍在进行（这一屏不会真的出现）</h2>
    <p class="phase">真机行为：匹配期间点窗口关闭按钮 → 弹下面这个原生确认框。点「关闭并停止」后<b>窗口不会立刻消失</b>，而是转到上面的「正在停止匹配…」态（最多 30 秒），等收尾完再关窗退出。</p>
    <div class="native">
      <div class="title">1688 畅销品监控 · 销量分析（正在匹配）</div>
      <div class="body">正在匹配同款：已完成 120/317 对，预计还需约 8 分钟。

关闭会停在这里：已判断的会保存，重新开始会接着算，不会重复花钱；但这一趟的分析结果会没。</div>
      <div class="buttons"><button>取消</button><button class="primary">关闭并停止</button></div>
    </div>`},
};
function render(state){
  const spec=STATES[state];
  $("maskBody").innerHTML=spec.html;
  $("snapshotInfo").innerHTML=spec.empty?PREPARING_INFO:REVIEW_INFO;
  $("products").innerHTML=spec.empty
    ? `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`
    : GROUPS.map((g,i)=>`<button class="group-choice" aria-pressed="${i===0}"><b>${g[0]}</b><small>${g[1]}</small><small>状态：待确认</small></button>`).join("");
  $("groupDetail").innerHTML=spec.empty
    ? `<p class="muted">等待冻结库存数据…</p>`
    : `<div class="bar"><h3 style="margin:0">G1 · 4 个商品</h3><span><button>确认当前分组</button></span></div><p>同款组销量 <b>182</b> · <span class="muted">待确认</span></p>
       <p><b>三层置物架大号</b><br><span class="muted">锦绣家居 · 商品 660123 · 区间销量 61</span></p>
       <p><b>三层置物架（加厚款）</b><br><span class="muted">锦绣家居 · 商品 660488 · 区间销量 52</span></p>`;
  $("matchingStatus").textContent=spec.empty?"":(state==="retry"?"上次匹配有可重试的失败，本次只补这些对":"");
  if(!$("mask").open)$("mask").showModal();
}
document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-state]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render(b.dataset.state);
});
render("fresh");
</script>
</html>
