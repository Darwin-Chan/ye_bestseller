<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>畅销品分析</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#203d33;font:14px/1.7 system-ui,sans-serif}header{background:#143e32;color:white;padding:24px max(24px,calc((100vw - 1120px)/2))}header h1{margin:0}main{max-width:1168px;margin:26px auto;padding:0 24px}.panel,article{background:white;border:1px solid #dce5df;border-radius:10px;padding:24px;margin:16px 0}.dates{display:grid;grid-template-columns:1fr 1fr;gap:28px}input,button{font:inherit;border:1px solid #b9cbc1;border-radius:5px;padding:8px 12px}button{cursor:pointer;background:white;color:#204d3d}button.primary{background:#196b51;color:white}button:disabled{opacity:.5;cursor:wait}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e4eae6}th{color:#61796c}.muted{color:#718578}.error{color:#a32d23;background:#fff1ed;padding:14px;border-radius:6px}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}details{margin:12px 0}dialog{border:0;border-radius:10px;max-width:580px;padding:26px}dialog::backdrop{background:#173c3266}dialog button{float:right;margin-top:12px}[hidden]{display:none!important}@media(max-width:700px){.dates{grid-template-columns:1fr}.bar{flex-wrap:wrap}}

.review-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;margin-top:20px}.group-choice{display:block;width:100%;text-align:left;margin:0 0 8px;padding:14px}.group-choice[aria-pressed=true]{border:2px solid #23795b;background:#edf6f1}.group-choice small{display:block}.matching-member{display:grid;grid-template-columns:130px minmax(0,1fr) 48px;gap:16px;border-top:1px solid #dce5df;padding:20px 0}.matching-member h4{margin:0 0 6px;font-size:16px}.matching-member p{margin:6px 0}.matching-tags span{display:block;font-size:12px;background:#edf5f0;border-radius:4px;padding:2px 6px;margin-top:5px}.member-info aside{border:1px solid #cbd9d0;border-radius:6px;padding:10px 12px;margin-top:10px}.member-info aside.change{border-color:#dfc99f}.remove-member{width:46px;height:58px;align-self:start;padding:9px}.remove-member svg{width:25px;height:28px}.group-actions{display:flex;gap:8px;flex-shrink:0}#groupDetail{margin:0;min-width:0}#groupDetail h3{margin:0}.member-info{min-width:0;overflow-wrap:anywhere}.member-info details{overflow:auto}.modal{width:min(850px,94vw);max-width:850px;max-height:90vh;padding:22px}.modal button{float:none;margin-top:0}.modal-body{max-height:50vh;overflow:auto;overscroll-behavior:contain}.modal-footer{border-top:1px solid #d8dfdb;padding-top:14px;margin-top:12px}.modal-actions{display:flex;align-items:center;gap:10px}.modal-actions .spacer{flex:1}.candidate{background:#f0f2f3;padding:12px;margin:10px 0;border:1px solid #dce1df;border-radius:6px}.candidate summary{cursor:pointer}.candidate .matching-member{grid-template-columns:120px minmax(0,1fr);padding:12px 0}.compare-current .matching-member{grid-template-columns:120px minmax(0,1fr);padding:10px 0;border:0}#candidateStatus{color:#79827e;margin:0 0 10px}#candidateStatus.selected{color:#2563ab}#candidateStatus small{display:block;color:#79827e}.search-item{display:flex;gap:14px;align-items:center;border-bottom:1px solid #dce5df;padding:12px}.search-item .member-info{flex:1}#removeDialog p{white-space:pre-line}#imageViewer{z-index:5}@media(max-width:800px){.review-layout{grid-template-columns:1fr}.matching-member{grid-template-columns:110px minmax(0,1fr) 44px;gap:8px}.group-actions{flex-wrap:wrap}.modal{padding:16px}}
.review-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}.review-filters select{font:inherit;padding:8px;border:1px solid #b9cbc1;border-radius:5px}.review-tabs{display:flex;gap:8px;margin:16px 0}.review-tabs [aria-selected=true]{background:#196b51;color:white}.group-row{display:flex;gap:8px;align-items:start}.group-row input{margin-top:20px}.matching-member.filter-hit{background:#edf8ee}.matching-tags span{cursor:default}.matching-tags .multiple{background:#fff0d9;color:#875b15}.matching-tags .unique{background:#e4f2ea;color:#236445}.matching-tags .none{background:#edf0f2;color:#59656e}#dirtyStatus{color:#986815}#selectionCount{color:#61796c}
</style>
<header><h1>畅销品分析</h1><span>选择日期 · 固定库存 · 核对商品</span></header>
<main><div id="error" class="error" role="alert" hidden></div>
<section id="datePage" class="panel"><h2>选择销量计算区间</h2><p class="muted">当日真实抓取数量不包含补齐库存。开始日期只作为销量基准。</p><div class="dates">
<section><label>开始日期 <input id="start" type="date"></label><h3>当日真实抓取</h3><div id="startCoverage">请选择日期</div></section>
<section><label>结束日期 <input id="end" type="date"></label><h3>当日真实抓取</h3><div id="endCoverage">请选择日期</div></section></div>
<p><button id="begin" class="primary">下一步、进入同款确认</button></p></section>
<section id="reviewPage" hidden><div class="bar"><h2>确认同款</h2><button id="back">重新选择日期</button></div><p id="snapshotInfo"></p><p class="muted">建议分组均待人工确认；失败项可重试模型匹配。低把握判断保留缓存，需人工核对。</p><button id="retryMatching" onclick="retryMatching()">重试模型匹配</button><div class="review-layout"><nav id="products" aria-label="同款分组列表"></nav><article id="groupDetail"></article></div><section id="results" hidden><h2>初步畅销品</h2><div id="ranking"></div></section><div class="bar"><button id="prev">上一页</button><span id="pageInfo"></span><button id="next">下一页</button></div></section>
</main><dialog id="bulkDialog" class="modal" aria-label="确认同款商品分组"><h2>确认同款商品分组</h2><p id="bulkScope"></p><p id="bulkMultiple"></p><div class="modal-actions"><span class="spacer"></span><button onclick="$('bulkDialog').close()">取消</button><button id="bulkOK" data-mutation onclick="confirmBulk()">确认</button></div></dialog>
<dialog id="notice"><p id="noticeText"></p><button id="noticeOK">继续</button></dialog>
<dialog id="imageViewer" aria-label="商品图片"><img id="largeImage" alt="商品主图" style="max-width:100%;max-height:70vh"><button onclick="this.closest('dialog').close()">关闭大图</button></dialog>
<dialog id="compareDialog" class="modal" aria-label="其他疑似归组"><h2>其他疑似归组</h2><div class="modal-body" id="compareBody"><div id="compareCurrent" class="compare-current"></div><div id="candidateList"></div></div><footer class="modal-footer"><div id="candidateStatus"></div><div class="modal-actions"><button id="compareRemove" onclick="requestRemoval(compareProduct)">移出当前组</button><span class="spacer"></span><button onclick="$('compareDialog').close()">取消</button><button id="joinCandidate" class="primary" data-mutation onclick="joinCandidate()" disabled>加入选中组</button></div></footer></dialog>
<dialog id="addDialog" class="modal" aria-label="组内新增商品"><h2>组内新增商品</h2><label>搜索商品 <input id="addQuery" aria-label="搜索商品" placeholder="商品名称、编号或店铺" oninput="addPage=0;renderAddResults()"></label><p id="addCount" class="muted"></p><div id="addResults" class="modal-body"></div><footer class="modal-footer modal-actions"><button id="addPrev" onclick="addPage--;renderAddResults()">上一页</button><button id="addNext" onclick="addPage++;renderAddResults()">下一页</button><span class="spacer"></span><button onclick="$('addDialog').close()">取消</button></footer></dialog>
<dialog id="removeDialog" class="modal" aria-label="移除商品"><h2>移除商品</h2><p>1. 移除商品后，会记住它与当前组其他商品的排除关系。
2. 当前商品被移除后，将重新匹配至其他待确认组。</p><div class="modal-actions"><span class="spacer"></span><button onclick="$('removeDialog').close()">取消</button><button id="removeOK" data-mutation onclick="removeMember()">确认移除</button></div></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[character]));
let settings = null, busy = false, noticeAction = null;

async function api(path, options) {
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '请求失败');
    return data;
}
function error(reason) {
    $('error').textContent = reason.message;
    $('error').hidden = false;
    const modal=[...document.querySelectorAll('dialog[open]')].at(-1);
    if(modal){
        let message=modal.querySelector('.dialog-error');
        if(!message){message=document.createElement('p');message.className='dialog-error error';message.setAttribute('role','alert');modal.prepend(message);}
        message.textContent=reason.message;
    }
}
function clearError() { $('error').hidden = true; document.querySelectorAll('.dialog-error').forEach(node=>node.remove()); }
function notice(text, action = null) {
    noticeAction = action;
    $('noticeText').textContent = text;
    $('notice').showModal();
}
$('noticeOK').onclick = () => {
    const action = noticeAction;
    noticeAction = null;
    $('notice').close();
    if (action) action();
};
async function getSettings() {
    if (!settings) settings = await api('/api/settings');
    return settings;
}
async function coverage(which) {
    const input = $(which), day = input.value, target = $(which + 'Coverage');
    if (!day) { target.textContent = '请选择日期'; return; }
    target.textContent = '正在读取…';
    try {
        const config = await getSettings();
        const rows = await api('/api/coverage?date=' + encodeURIComponent(day));
        if (input.value !== day) return;
        target.innerHTML = `<table aria-label="${which === 'start' ? '开始' : '结束'}日期真实抓取">
            <thead><tr><th>店铺</th><th>商品数</th><th>SKU 数</th></tr></thead><tbody>
            ${rows.map(row => `<tr><td>${esc(row.shop_name || row.shop_key)}</td>
                <td>${row.products}</td><td>${row.skus}</td></tr>`).join('')}
            </tbody></table>`;
        const weekday = new Date(day + 'T12:00:00+08:00').getUTCDay() || 7;
        if (weekday !== config.full_capture_weekday && !$('notice').open) {
            const name = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'][config.full_capture_weekday];
            notice(`你选择的日期可能库存数据不完整，只有每${name}会全量抓取库存数据`);
        }
    } catch (reason) {
        if (input.value === day) {
            target.textContent = '读取失败，请重新选择日期重试';
            error(reason);
        }
    }
}
for (const which of ['start', 'end']) {
    $(which).addEventListener('change', () => { clearError(); coverage(which); });
}
let currentSnapshot=null, productPage=0, selectedGroup=null, inventoryByProduct=new Map();
let compareProduct=null, candidateTarget=null, removalProduct=null, addPage=0, editBusy=false;
let reviewTab='all', checkedGroups=new Set(), bulkTargets=[];
let productsByKey=new Map(), groupsByProduct=new Map();
const productKey=p=>JSON.stringify([p.shop_key,p.offer_id]);
const reviewControls=document.createElement('div');
reviewControls.innerHTML=`<p id="dirtyStatus" role="status"></p><div class="review-tabs" role="tablist" aria-label="确认状态"><button role="tab" data-tab="all" aria-selected="true">全部</button><button role="tab" data-tab="pending" aria-selected="false">待确认</button><button role="tab" data-tab="confirmed" aria-selected="false">已确认</button></div><div class="review-filters"><label>搜索分组商品 <input id="reviewQuery" placeholder="商品名称、编号或店铺"></label><label>商品来源 <select id="originFilter" aria-label="商品来源"><option value="">全部来源</option><option>新商品</option><option>信息变更</option></select></label><label>匹配状态 <select id="matchFilter" aria-label="匹配状态"><option value="">全部匹配状态</option><option>暂无匹配同款</option><option>匹配唯一同款</option><option>匹配多组同款</option></select></label></div><div class="review-filters"><button id="confirmSelected" onclick="openBulk(false)">确认勾选组</button><button id="confirmFiltered" onclick="openBulk(true)">确认当前筛选全部组</button><span id="selectionCount"></span></div>`;
$('reviewPage').insertBefore(reviewControls,document.querySelector('.review-layout'));
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{reviewTab=button.dataset.tab;resetReview();});
for(const id of ['reviewQuery','originFilter','matchFilter'])$(id).addEventListener(id==='reviewQuery'?'input':'change',resetReview);
function resetReview(){checkedGroups.clear();productPage=0;selectedGroup=null;renderProducts();}
function matchesProduct(p){
    const query=$('reviewQuery').value.trim().toLocaleLowerCase();
    return (!$('originFilter').value||p.origin===$('originFilter').value)
        && (!$('matchFilter').value||p.match_label===$('matchFilter').value)
        && (!query||[p.product_name,p.offer_id,p.shop_key,shopName(p)].some(v=>String(v||'').toLocaleLowerCase().includes(query)));
}
function filteredGroups(){
    return currentSnapshot.groups.filter(g=>(reviewTab==='all'||g.confirmed===(reviewTab==='confirmed'))&&groupProducts(g).some(matchesProduct));
}
function updateBatchControls(){
    $('selectionCount').textContent=`已勾选 ${checkedGroups.size} 组`;
    $('confirmSelected').disabled=!currentSnapshot.groups.some(g=>!g.confirmed&&checkedGroups.has(g.id));
    $('confirmFiltered').disabled=!filteredGroups().some(g=>!g.confirmed);
}
function checkGroup(id,checked){if(checked)checkedGroups.add(id);else checkedGroups.delete(id);updateBatchControls();}
function openBulk(all){
    if(editBusy)return;
    const targets=(all?filteredGroups():currentSnapshot.groups.filter(g=>checkedGroups.has(g.id))).filter(g=>!g.confirmed);
    if(!targets.length)return;
    bulkTargets=targets.map(g=>g.id);
    const members=new Map(targets.flatMap(g=>groupProducts(g).map(p=>[productKey(p),p])));
    const multiple=[...members.values()].filter(p=>p.match_label==='匹配多组同款').length;
    $('bulkScope').textContent=`将确认${targets.length}个同款分组，包含${members.size}个商品。`;
    $('bulkMultiple').textContent=multiple?`其中包含${multiple}个匹配到多组的商品，这些商品按照系统推荐分组推进。`:'其中不含匹配到多组的商品';
    $('bulkDialog').showModal();
}
async function confirmBulk(){if(await changeConfirmation({action:'confirm_groups',groups:bulkTargets}))$('bulkDialog').close();}
function show(snapshot) {
    currentSnapshot=snapshot;
    productPage=0; selectedGroup=null;reviewTab='all';checkedGroups.clear();
    for(const id of ['reviewQuery','originFilter','matchFilter'])$(id).value='';
    inventoryByProduct=new Map();
    for(const row of snapshot.inventory) {
        const key=JSON.stringify([row.shop_key,row.offer_id]);
        if(!inventoryByProduct.has(key)) inventoryByProduct.set(key,[]);
        inventoryByProduct.get(key).push(row);
    }
    $('start').value=snapshot.start;
    $('end').value=snapshot.end;
    $('datePage').hidden=true;
    $('reviewPage').hidden=false;
    $('snapshotInfo').textContent=`${snapshot.start} — ${snapshot.end} · 数据固定于 ${snapshot.frozen_at} · ${snapshot.groups.length} 个同款组`;
    renderProducts();
    history.replaceState(null,'','#analysis='+snapshot.id);
}
function productPhoto(p) {
    return p.image_data?`<button style="padding:6px;flex-shrink:0" aria-label="放大商品图片" onclick="showProductImage(this)"><img alt="${esc(p.product_name)}" src="${esc(p.image_data)}" style="width:100px;height:100px;object-fit:contain"></button>`:`<span title="${esc(p.image_error)}">历史图片缺失</span>`;
}
function showProductImage(button) {
    $('largeImage').src=button.querySelector('img').src;
    $('imageViewer').showModal();
}
function sourceIcon(p) {
    return /^https?:\/\//i.test(p.product_url||'')?`<a data-source-offer="${esc(p.offer_id)}" aria-label="商品源地址" title="商品源地址" href="${esc(p.product_url)}" target="_blank" rel="noopener noreferrer" data-offer="${esc(p.offer_id)}" onclick="openCurrentSource(event,this.dataset.offer)">↗</a>`:`<span data-source-offer="${esc(p.offer_id)}" aria-disabled="true" title="暂无商品源地址" style="color:#aaa">↗</span>`;
}
async function openCurrentSource(event, offer) {
    event.preventDefault(); event.stopPropagation();
    const tab=window.open('about:blank','_blank');
    if(tab)tab.opener=null;
    try {
        const data=await api('/api/source?offer='+encodeURIComponent(offer));
        if(!/^https?:\/\//i.test(data.url||''))throw new Error('暂无商品源地址');
        if(tab)tab.location=data.url;
    } catch(e) {if(tab)tab.close();error(e);}
}
async function refreshSourceLinks() {
    await Promise.allSettled([...document.querySelectorAll('[data-source-offer]')].map(async node=>{
        const offer=node.dataset.sourceOffer;
        const current=await api('/api/source?offer='+encodeURIComponent(offer));
        if(node.isConnected)node.outerHTML=sourceIcon({offer_id:offer,product_url:current.url});
    }));
}
window.addEventListener('focus', refreshSourceLinks);
function groupProducts(group) {
    return group.members.map(m=>productsByKey.get(productKey(m))).sort((a,b)=>b.sales-a.sales);
}
function memberIndex(p) {return currentSnapshot.products.indexOf(p);}
function memberGroup(p) {return groupsByProduct.get(productKey(p));}
function shopName(p) {return currentSnapshot.shops.find(s=>s.shop_key===p.shop_key)?.shop_name||p.shop_key;}
function memberCard(p, full=false) {
    const group=memberGroup(p), index=memberIndex(p), candidates=(p.candidate_groups||[]).filter(id=>id!==group.id);
    const hit=full&&[$('reviewQuery').value.trim(),$('originFilter').value,$('matchFilter').value].some(Boolean)&&matchesProduct(p);
    return `<section class="matching-member${hit?' filter-hit':''}" data-product="${esc(p.offer_id)}"><div>${productPhoto(p)}${full?`<div class="matching-tags"><span>${esc(p.origin)}</span><span class="${p.match_label==='匹配多组同款'?'multiple':p.match_label==='匹配唯一同款'?'unique':'none'}">${esc(p.match_label)}</span></div>`:''}</div><div class="member-info"><h4>${esc(p.product_name||p.offer_id)} ${sourceIcon(p)}</h4><p>${esc(shopName(p))} · 商品 ${esc(p.offer_id)}</p><p>区间销量 <b>${p.sales}</b></p>${full?`
        <p class="muted">${esc(p.matching_status)}</p>${p.origin==='信息变更'||p.information_note?`<aside class="change"><b>信息变更</b><p>${esc(p.information_note||'商品名称或图片已有变更，请核对当前信息。')}</p></aside>`:''}
        <aside><b>其他疑似归组</b><p>${candidates.length?candidates.map(id=>`<button data-group="${esc(id)}" onclick="openCompare(${index},this.dataset.group)">${esc(id)}</button>`).join(' '):'暂无匹配同款'}</p></aside>
        ${p.skus.map(sku=>`<details open><summary>${esc(sku.name)} · 第 ${sku.segment} 段 · SKU ${esc(sku.sku_id)} · 销量 <b>${sku.sales}</b></summary><table><thead><tr><th>日期</th><th>库存</th><th>当日销量</th><th>状态</th></tr></thead><tbody>${sku.points.map(point=>`<tr><td>${point.date}</td><td>${point.stock??'—'}</td><td>${point.sales}</td><td>${point.color==='inactive'?'不在有效段':point.color==='red'?'疑似补货':point.color==='yellow'?'当日未抓取库存':'正常观测'}</td></tr>`).join('')}</tbody></table></details>`).join('')}`:''}</div>
        ${full&&group.members.length>1?`<button class="remove-member" data-mutation aria-label="从当前分组移除商品" title="从当前分组移除商品" onclick="requestRemoval(${index})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>`:''}</section>`;
}
function selectGroup(id) {selectedGroup=id;renderProducts();}
function renderProducts() {
    const snapshot=currentSnapshot;
    productsByKey=new Map(snapshot.products.map(p=>[productKey(p),p]));
    groupsByProduct=new Map(snapshot.groups.flatMap(g=>g.members.map(m=>[productKey(m),g])));
    checkedGroups=new Set([...checkedGroups].filter(id=>snapshot.groups.some(g=>g.id===id&&!g.confirmed)));
    const filtered=filteredGroups(), pages=Math.max(1,Math.ceil(filtered.length/20));
    productPage=Math.min(productPage,pages-1);
    const visible=filtered.slice(productPage*20,productPage*20+20);
    if(!visible.some(g=>g.id===selectedGroup))selectedGroup=visible[0]?.id;
    $('products').innerHTML=visible.map(g=>`<div class="group-row"><input type="checkbox" aria-label="勾选 ${esc(g.id)}" data-group="${esc(g.id)}" ${checkedGroups.has(g.id)?'checked':''} ${g.confirmed?'disabled':''} onchange="checkGroup(this.dataset.group,this.checked)"><button class="group-choice" aria-pressed="${g.id===selectedGroup}" data-group="${esc(g.id)}" onclick="selectGroup(this.dataset.group)"><b>${esc(g.id)} · ${g.members.length} 个商品</b><small>${esc(groupProducts(g)[0].product_name)} · 销量 ${g.sales}</small><small>状态：${g.confirmed?'已确认':'待确认'}</small></button></div>`).join('');
    const group=snapshot.groups.find(g=>g.id===selectedGroup);
    $('groupDetail').innerHTML=group?`<div class="bar"><h3>${esc(group.id)} · ${group.members.length} 个商品</h3><div class="group-actions"><button data-mutation ${group.confirmed&&reviewTab!=='confirmed'?'disabled':''} onclick="${group.confirmed?"changeConfirmation({action:'withdraw',group:selectedGroup})":'confirmGroup(selectedGroup)'}">${group.confirmed?(reviewTab==='confirmed'?'撤回当前分组':'已确认'):'确认当前分组'}</button><button onclick="openAdd()">组内新增商品</button></div></div><p>同款组销量 <b>${group.sales}</b> · <span class="group-status">${group.confirmed?'已确认':'待确认'}</span></p>${groupProducts(group).map(p=>memberCard(p,true)).join('')}`:'暂无符合条件的分组';
    $('dirtyStatus').textContent=snapshot.dirty?'未保存':'';
    document.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',button.dataset.tab===reviewTab));
    updateBatchControls();
    $('snapshotInfo').textContent=`${snapshot.start} — ${snapshot.end} · 数据固定于 ${snapshot.frozen_at} · ${snapshot.products.length}商品 ${snapshot.groups.length}组同款（其中${snapshot.groups.filter(g=>!g.confirmed).length}待确认）`;
    $('pageInfo').textContent=`${productPage+1} / ${pages}`;
    $('prev').disabled=productPage===0;
    $('next').disabled=productPage+1>=pages;
    $('results').hidden=!snapshot.groups.length || !snapshot.groups.every(g=>g.confirmed);
    if (!$('results').hidden) renderRanking();
    refreshSourceLinks();
}
function openCompare(index, expanded) {
    compareProduct=index; candidateTarget=null;
    const p=currentSnapshot.products[index], source=memberGroup(p);
    $('compareCurrent').innerHTML=memberCard(p);
    $('candidateList').innerHTML=(p.candidate_groups||[]).filter(id=>id!==source.id).map(id=>currentSnapshot.groups.find(g=>g.id===id)).filter(Boolean).map(g=>`<details class="candidate" ${g.id===expanded?'open':''}><summary>${esc(g.id)} · ${g.members.length} 个商品 · 销量 ${g.sales} · ${g.confirmed?'已确认':'待确认'}</summary><label><input type="radio" name="candidate" value="${esc(g.id)}" onchange="chooseCandidate(this.value)">选择 ${esc(g.id)}</label>${groupProducts(g).map(p=>memberCard(p)).join('')}</details>`).join('');
    $('compareRemove').hidden=source.members.length<2;
    updateCandidateStatus(); $('compareDialog').showModal(); $('compareBody').scrollTop=0; refreshSourceLinks();
}
function chooseCandidate(id) {candidateTarget=id;updateCandidateStatus();}
function updateCandidateStatus() {
    $('candidateStatus').className=candidateTarget?'selected':'';
    $('candidateStatus').innerHTML=candidateTarget?`✓ 已选 ${esc(candidateTarget)}<small>加入后两个组各自保留原确认状态。</small>`:'ⓘ 请选择候选组，或保留当前归属。';
    $('joinCandidate').disabled=!candidateTarget;
}
function requestRemoval(index) {
    if(editBusy)return;
    removalProduct=index;
    if(memberGroup(currentSnapshot.products[index]).members.length>1)$('removeDialog').showModal();
}
async function mutate(action,index,target=null) {
    if(editBusy)return false;
    editBusy=true; clearError();
    const p=currentSnapshot.products[index], source=memberGroup(p);
    const controls=[...document.querySelectorAll('[data-mutation]')].map(node=>[node,node.disabled]);
    controls.forEach(([node])=>node.disabled=true);
    try {
        currentSnapshot=await api('/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:currentSnapshot.id,action,group:source.id,member:{shop_key:p.shop_key,offer_id:p.offer_id},target})});
        renderProducts();return true;
    } catch(e) {error(e);return false;}
    finally {editBusy=false;controls.forEach(([node,disabled])=>node.disabled=disabled);}
}
async function removeMember() {
    if(await mutate('remove',removalProduct)){$('removeDialog').close();$('compareDialog').close();}
}
async function joinCandidate() {
    if(candidateTarget&&await mutate('move',compareProduct,candidateTarget))$('compareDialog').close();
}
function openAdd() {addPage=0;$('addQuery').value='';renderAddResults();$('addDialog').showModal();}
function renderAddResults() {
    const q=$('addQuery').value.trim().toLocaleLowerCase();
    const matches=currentSnapshot.products.filter(p=>memberGroup(p).id!==selectedGroup&&[p.product_name,p.offer_id,p.shop_key,shopName(p)].some(v=>String(v||'').toLocaleLowerCase().includes(q)));
    $('addCount').textContent=`${matches.length} 个商品 · ${addPage+1} / ${Math.max(1,Math.ceil(matches.length/30))}`;
    $('addResults').innerHTML=matches.slice(addPage*30,addPage*30+30).map(p=>`<section class="search-item">${productPhoto(p)}<div class="member-info"><h4>${esc(p.product_name)} ${sourceIcon(p)}</h4><p>${esc(shopName(p))} · ${esc(p.offer_id)} · 销量 ${p.sales}</p><p>${esc(memberGroup(p).id)} · ${memberGroup(p).confirmed?'已确认':'待确认'}</p></div><button data-mutation onclick="addMember(${memberIndex(p)})">添加到当前组</button></section>`).join('')||'<p>没有匹配商品</p>';
    $('addPrev').disabled=addPage===0;$('addNext').disabled=(addPage+1)*30>=matches.length;
    $('addResults').scrollTop=0;refreshSourceLinks();
}
async function addMember(index) {if(await mutate('move',index,selectedGroup))$('addDialog').close();}
async function retryMatching() {
    if(editBusy)return;
    editBusy=true;
    $('retryMatching').disabled=true;
    try {
        currentSnapshot=await api('/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:currentSnapshot.id,action:'retry_matching'})});
        productPage=0; renderProducts();
    } catch(e) {error(e);} finally {editBusy=false;$('retryMatching').disabled=false;}
}
async function confirmGroup(group) {
    await changeConfirmation({group});
}
async function changeConfirmation(operation){
    if(editBusy)return false;
    editBusy=true;clearError();$('bulkOK').disabled=true;
    try{currentSnapshot=await api('/api/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:currentSnapshot.id,...operation})});renderProducts();return true;}
    catch(e){error(e);return false;}finally{editBusy=false;$('bulkOK').disabled=false;}
}
function inventoryChart(points, sku=false) {
    const width=680, height=160, stocks=points.filter(p=>p.stock!==null).map(p=>p.stock);
    const maxStock=Math.max(1,...stocks), total=points.reduce((n,p)=>n+p.sales,0);
    const x=i=>50+i*580/Math.max(1,points.length-1), y=v=>190-v/maxStock*height;
    let cumulative=0, previous=null, marks='';
    points.forEach((p,i)=>{
        cumulative+=p.sales;
        if(p.stock===null){previous=null;return;}
        const sy=190-cumulative/Math.max(1,total)*height;
        if(previous!==null && !p.segment_start) marks+=`<line x1="${x(i-1)}" y1="${y(previous.stock)}" x2="${x(i)}" y2="${y(p.stock)}" stroke="#39856b"/><line x1="${x(i-1)}" y1="${190-(cumulative-p.sales)/Math.max(1,total)*height}" x2="${x(i)}" y2="${sy}" stroke="#5973b4" stroke-dasharray="4 3"/>`;
        const tip=p.color==='red'?(sku?'库存增加，疑似补货，该时段销量设定为0':'存在疑似补货SKU'):p.color==='yellow'?'当日未抓取库存':'';
        marks+=`<circle data-date="${p.date}" data-stock="${p.stock}" cx="${x(i)}" cy="${y(p.stock)}" r="4" fill="${{red:'#ce4c46',yellow:'#b68818',green:'#318763'}[p.color]}">${tip?`<title>${tip}</title>`:''}</circle><circle cx="${x(i)}" cy="${sy}" r="3" fill="#5973b4"/><text x="${x(i)}" y="215" text-anchor="middle" font-size="10">${p.date.slice(5)}</text>`;
        previous=p;
    });
    return `<svg class="inventory-chart" viewBox="0 0 ${width} 230" role="img" aria-label="库存与累计销量" style="width:100%"><text x="10" y="16">库存 0–${maxStock}</text><text x="450" y="16">累计销量 0–${total}</text>${marks}</svg>`;
}
function renderRanking() {
    $('ranking').innerHTML=currentSnapshot.groups.map(g=>{const members=groupProducts(g);return {...members[0],sales:g.sales,skus:members.flatMap(p=>p.skus),points:members[0].points.map((point,i)=>({...point,stock:members.every(p=>p.points[i].stock===null)?null:members.reduce((n,p)=>n+(p.points[i].stock??0),0),sales:members.reduce((n,p)=>n+p.points[i].sales,0),color:members.some(p=>p.points[i].color==='red')?'red':'green',segment_start:members.some(p=>p.points[i].segment_start)}))}}).sort((a,b)=>b.sales-a.sales).map((p,index)=>`<details class="rank"><summary><b>${String(index+1).padStart(2,'0')}</b> ${esc(p.product_name||p.offer_id)} · <b>${p.sales}</b> 销量</summary><p>${esc(p.shop_key)} · 商品 ${esc(p.offer_id)}</p>${inventoryChart(p.points)}<table><thead><tr><th>日期</th><th>库存</th><th>累计销量</th><th>状态</th></tr></thead><tbody>${p.points.map((point,i)=>`<tr><td>${point.date}</td><td>${point.stock ?? '—'}</td><td>${p.points.slice(0,i+1).reduce((sum,item)=>sum+item.sales,0)}</td><td>${point.color==='inactive'?'不在有效段':point.color==='red'?'疑似补货':point.color==='yellow'?'当日未抓取库存':'正常观测'}</td></tr>`).join('')}</tbody></table>${(p.skus||[]).map(sku=>`<details open><summary>${esc(sku.name)} · 销量 ${sku.sales}</summary><p>第 ${sku.segment} 个规格有效段</p>${inventoryChart(sku.points,true)}</details>`).join('')}</details>`).join('');
}
$('prev').onclick=()=>{if(productPage>0){productPage--;renderProducts()}};
$('next').onclick=()=>{if((productPage+1)*20<filteredGroups().length){productPage++;renderProducts()}};
async function begin(acknowledged = false) {
    if (busy || editBusy) return;
    clearError();
    const start = $('start').value, end = $('end').value;
    if (!start || !end || start >= end) {
        error(new Error('请选择有效日期，结束日期必须晚于开始日期'));
        return;
    }
    busy = true;
    $('begin').disabled = true;
    try {
        const data = await api('/api/analysis', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({start, end, acknowledged})
        });
        if (data.needs_confirmation) {
            notice('当前存在运行中的库存抓取程序，为避免数据变化，将锁定当前数据生成后续分析', () => begin(true));
        } else {
            show(data);
        }
    } catch (reason) {
        error(reason);
    } finally {
        busy = false;
        $('begin').disabled = false;
    }
}
$('begin').onclick = () => begin();
$('back').onclick = () => {
    if(editBusy)return;
    history.replaceState(null, '', location.pathname);
    $('reviewPage').hidden = true;
    $('datePage').hidden = false;
    clearError();
    for (const which of ['start', 'end']) coverage(which);
};
(async () => {
    try {
        await getSettings();
        const id = new URLSearchParams(location.hash.slice(1)).get('analysis');
        if (id) show(await api('/api/analysis?id=' + encodeURIComponent(id)));
    } catch (reason) {
        error(reason);
    }
})();
</script></html>
